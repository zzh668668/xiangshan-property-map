  .cross-y { width: 1px; height: 40px; top: -20px; left: 0; }

var partyColor = { '甲': '#e63946', '乙': '#f4a261', '丙': '#a855f7', '丁': '#2a9d8f', '其他': '#8b5cf6' };
var mapImg = document.getElementById('mapImg');
var inner = document.getElementById('inner');
var dotLayer = document.getElementById('dotLayer');
var mainArea = document.getElementById('mainArea');
var crosshair = document.getElementById('crosshair');
var imgW = 0, imgH = 0, scale = 1, panX = 0, panY = 0, isDragging = false;
var currentMode = 'view';
var currentPartyFilter = 'all', currentSearchText = '';
var lastPick = { rx: 0, ry: 0 };

mapImg.onload = function() { imgW = mapImg.naturalWidth; imgH = mapImg.naturalHeight; renderStat(); renderMarkers(); renderPropList(); fitToStage(); };

function applyTransform() { inner.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')'; }

function fitToStage() {
  var sw = mainArea.clientWidth, sh = mainArea.clientHeight;
  if (!imgW) return;
  scale = Math.min(sw / imgW, sh / imgH) * 0.85;
  panX = (sw - imgW * scale) / 2;
  panY = (sh - imgH * scale) / 2;
  applyTransform();
}

function renderStat() {
  var counts = {};
  properties.forEach(function(p) { counts[p.party] = (counts[p.party] || 0) + 1; });
  var html = '';
  Object.keys(counts).forEach(function(p) {
    html += '<div class="stat-item"><div class="stat-num" style="color:' + partyColor[p] + '">' + counts[p] + '</div><div class="stat-label">' + p + '方</div></div>';
  });
  document.getElementById('statBar').innerHTML = html;
}

function renderMarkers() {
  dotLayer.innerHTML = '';
  properties.forEach(function(p) {
    var matchParty = currentPartyFilter === 'all' || p.party === currentPartyFilter;
    var searchText = currentSearchText || '';
    var matchSearch = !searchText || p.name.toLowerCase().indexOf(searchText) >= 0 || p.party.toLowerCase().indexOf(searchText) >= 0 || (p.tenant && p.tenant.toLowerCase().indexOf(searchText) >= 0) || (p.industry && p.industry.toLowerCase().indexOf(searchText) >= 0);
    if (!matchParty || !matchSearch) return;
    var el = document.createElement('div');
    el.className = 'dm ' + (p.partyKey || 'other');
    var color = p.otherColor || partyColor[p.party] || '#71767b';
    el.innerHTML = '<div class="dm-body" style="background:' + color + '">' + p.id + '</div><div class="dm-num">' + p.id + '</div>';
    el.style.left = (p.rx * imgW) + 'px';
    el.style.top = ((1 - p.ry) * imgH) + 'px';
    el.onclick = function(e) { e.stopPropagation(); highlightProp(p.id); };
    dotLayer.appendChild(el);
  });
}

function renderPropList() {
  var list = document.getElementById('propList');
  var filtered = properties.filter(function(p) {
    var matchParty = currentPartyFilter === 'all' || p.party === currentPartyFilter;
    var searchText = currentSearchText || '';
    var matchSearch = !searchText || p.name.toLowerCase().indexOf(searchText) >= 0 || p.party.toLowerCase().indexOf(searchText) >= 0 || (p.tenant && p.tenant.toLowerCase().indexOf(searchText) >= 0) || (p.industry && p.industry.toLowerCase().indexOf(searchText) >= 0);
    return matchParty && matchSearch;
  });
  if (filtered.length === 0) { list.innerHTML = '<div style="text-align:center;color:#71767b;padding:20px;font-size:12px">没有找到匹配的物业</div>'; return; }
  var html = '';
  filtered.forEach(function(p) {
    var color = p.otherColor || partyColor[p.party] || '#71767b';
    html += '<div class="prop-item" data-id="' + p.id + '" onclick="highlightProp(\'' + p.id + '\')"><div class="prop-dot" style="background:' + color + '"></div><div class="prop-info"><div class="prop-id">' + p.id + ' · ' + p.party + '方</div><div class="prop-name">' + p.name + '</div><div class="prop-coord">' + p.rx.toFixed(4) + ', ' + p.ry.toFixed(4) + '</div></div></div>';
  });
  list.innerHTML = html;
}

function highlightProp(id) {
  var p = properties.find(function(x) { return x.id === id; });
  if (!p) return;
  document.querySelectorAll('.prop-item').forEach(function(el) { el.classList.toggle('active', el.dataset.id === id); });
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('propList').style.display = 'none';
  var badge = document.getElementById('detailBadge');
  badge.textContent = p.id;
  badge.className = 'detail-badge ' + (p.partyKey || 'other');
  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailId').textContent = p.id + '号';
  document.getElementById('detailParty').textContent = p.party + '方';
  document.getElementById('detailArea').textContent = p.area || '-';
  document.getElementById('detailTenant').textContent = p.tenant || '-';
  document.getElementById('detailIndustry').textContent = p.industry || '-';
  document.getElementById('detailStatus').textContent = p.status || '-';
  document.getElementById('detailContact').textContent = (p.contact || '-') + ' ' + (p.phone || '');
}

function closeDetail() {
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('propList').style.display = 'block';
  document.querySelectorAll('.prop-item').forEach(function(el) { el.classList.remove('active'); });
}

function filterProperties() { currentSearchText = document.getElementById('searchInput').value.toLowerCase().trim(); renderPropList(); renderMarkers(); }
function setPartyFilter(party, btn) { currentPartyFilter = party; document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); }); btn.classList.add('active'); renderPropList(); renderMarkers(); }

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnView').classList.toggle('active', mode === 'view');
  document.getElementById('btnPick').classList.toggle('active', mode === 'pick');
  document.getElementById('pickPanel').style.display = mode === 'pick' ? 'block' : 'none';
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('propList').style.display = mode === 'view' ? 'block' : 'none';
  document.getElementById('panelTitle').textContent = mode === 'pick' ? '坐标拾取' : '物业列表';
  crosshair.classList.toggle('show', mode === 'pick');
  document.getElementById('bottomHint').innerHTML = mode === 'pick' ? '<span>单击</span>地图获取坐标 | <span>滚轮</span>缩放 | <span>Shift+拖拽</span>平移' : '<span>滚轮</span>缩放 | <span>Shift+拖拽</span>平移 | 点击<span>标记</span>查看详情';
}

function screenToRel(sx, sy) {
  var px = (sx - panX) / scale;
  var py = (sy - panY) / scale;
  return { rx: px / imgW, ry: 1 - py / imgH };
}

function copyPickCoord() {
  var rx = lastPick.rx.toFixed(4);
  var ry = lastPick.ry.toFixed(4);
  var text = rx + ', ' + ry;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ 已复制: ' + text;
    setTimeout(function() { btn.textContent = '📋 复制坐标'; }, 2000);
  });
}

var dragStart = { x: 0, y: 0, panX: 0, panY: 0 };
mainArea.addEventListener('mousedown', function(e) {
  if (e.button !== 0) return;
  if (e.shiftKey) {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY, panX: panX, panY: panY };
    mainArea.style.cursor = 'grabbing';
  } else if (currentMode === 'pick') {
    var rect = mainArea.getBoundingClientRect();
    var c = screenToRel(e.clientX - rect.left, e.clientY - rect.top);
    lastPick = { rx: c.rx, ry: c.ry };
    document.getElementById('pickRxRy').textContent = c.rx.toFixed(4) + ', ' + c.ry.toFixed(4);
    document.getElementById('pickPxPy').textContent = Math.round(c.rx * imgW) + ', ' + Math.round((1 - c.ry) * imgH);
    crosshair.style.left = (c.rx * imgW) + 'px';
    crosshair.style.top = ((1 - c.ry) * imgH) + 'px';
  }
});

mainArea.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  panX = dragStart.panX + (e.clientX - dragStart.x);
  panY = dragStart.panY + (e.clientY - dragStart.y);
  applyTransform();
});

mainArea.addEventListener('mouseup', function() { isDragging = false; mainArea.style.cursor = 'default'; });

mainArea.addEventListener('wheel', function(e) {
  e.preventDefault();
  var rect = mainArea.getBoundingClientRect();
  var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  var ix = (sx - panX) / scale, iy = (sy - panY) / scale;
  var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  scale = Math.max(0.2, Math.min(5, scale * factor));
  panX = sx - ix * scale;
  panY = sy - iy * scale;
  applyTransform();
}, { passive: false });

window.addEventListener('resize', fitToStage);
</script>
