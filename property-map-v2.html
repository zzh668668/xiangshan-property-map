<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>象山片区物业可视化系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #0f1419; color: #e7e9ea;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: #1a1f26; border-bottom: 1px solid #2f3336;
    padding: 8px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0; z-index: 100;
  }
  .logo { font-size: 14px; font-weight: 700; color: #f4a261; }
  .mode-switch {
    margin-left: auto; display: flex; gap: 8px;
  }
  .mode-btn {
    padding: 6px 14px; border-radius: 6px; font-size: 12px;
    cursor: pointer; border: 1px solid #2f3336;
    background: #2f3336; color: #71767b;
  }
  .mode-btn.active {
    background: #f4a261; color: #0f1419; border-color: #f4a261;
    font-weight: 700;
  }
  .main { flex: 1; position: relative; overflow: hidden; background: #0a0e12; }
  #inner {
    position: absolute; transform-origin: 0 0; line-height: 0;
  }
  #mapImg { display: block; }
  #dotLayer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .dm {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: auto; cursor: pointer; z-index: 10;
  }
  .dm-body {
    width: 42px; height: 42px; border-radius: 50% 50% 50% 0;
    border: 3px solid white; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white;
    transform: rotate(-45deg);
  }
  .dm-num {
    position: absolute; top: -8px; left: -8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: white; color: #0f1419;
    font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .dm.jia .dm-body { background: #e63946; }
  .dm.yi .dm-body { background: #f4a261; }
  .dm.bing .dm-body { background: #a855f7; }
  .dm.ding .dm-body { background: #2a9d8f; }

  #crosshair {
    position: absolute; pointer-events: none; z-index: 50; display: none;
  }
  #crosshair.show { display: block; }
  .cross-x, .cross-y {
    position: absolute; background: #f4a261;
  }
  .cross-x { height: 1px; width: 40px; left: -20px; top: 0; }
  .cross-y { width: 1px; height: 40px; top: -20px; left: 0; }
  .cross-center {
    position: absolute; width: 8px; height: 8px;
    border: 2px solid #f4a261; border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .side-panel {
    position: absolute; top: 12px; right: 12px; width: 280px;
    background: rgba(26,31,38,0.98); border: 1px solid #2f3336;
    border-radius: 12px; padding: 14px; z-index: 100;
    max-height: calc(100% - 24px); overflow-y: auto;
  }
  .panel-title {
    font-size: 13px; font-weight: 700; color: #f4a261;
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid #2f3336;
  }

  .search-box {
    position: relative; margin-bottom: 12px;
  }
  .search-input {
    width: 100%; padding: 10px 12px 10px 36px;
    background: #0f1419; border: 1px solid #2f3336;
    border-radius: 8px; color: #e7e9ea; font-size: 13px;
  }
  .search-input::placeholder { color: #71767b; }
  .search-input:focus { outline: none; border-color: #f4a261; }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #71767b; font-size: 14px;
  }
  
  .party-filter {
    display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 10px; border-radius: 15px; font-size: 11px;
    cursor: pointer; border: 1px solid #2f3336;
    background: #2f3336; color: #71767b;
  }
  .filter-btn:hover { border-color: #71767b; }
  .filter-btn.active { color: white; font-weight: 700; }
  .filter-btn.jia.active { background: #e63946; border-color: #e63946; }
  .filter-btn.yi.active { background: #f4a261; border-color: #f4a261; }
  .filter-btn.bing.active { background: #a855f7; border-color: #a855f7; }
  .filter-btn.ding.active { background: #2a9d8f; border-color: #2a9d8f; }

  .pick-result {
    background: #0f1419; border-radius: 8px; padding: 12px;
    margin-bottom: 12px;
  }
  .pick-result .coord-row {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; font-size: 12px;
  }
  .pick-result .coord-row:last-child { margin-bottom: 0; }
  .pick-result .label { color: #71767b; }
  .pick-result .value {
    font-family: 'Courier New', monospace; color: #f4a261;
    font-weight: 700;
  }
  .btn-copy {
    width: 100%; padding: 8px; margin-top: 10px;
    background: #2a9d8f; color: white; border: none;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }

  .prop-list { max-height: 300px; overflow-y: auto; }
  .prop-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; border-radius: 6px; margin-bottom: 4px;
    background: #1a1f26; cursor: pointer; font-size: 12px;
  }
  .prop-item:hover { background: #2f3336; }
  .prop-item.active { border: 1px solid #f4a261; }
  .prop-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .prop-info { flex: 1; }
  .prop-id { font-weight: 700; color: #e7e9ea; }
  .prop-name { color: #71767b; font-size: 11px; }
  .prop-coord { font-family: monospace; color: #a855f7; font-size: 10px; }

  .detail-panel {
    background: #1a1f26; border-radius: 8px; padding: 14px;
    margin-bottom: 12px; border: 1px solid #2f3336;
  }
  .detail-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .detail-badge {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white;
    font-weight: 800;
  }
  .detail-badge.jia { background: #e63946; }
  .detail-badge.yi { background: #f4a261; }
  .detail-badge.bing { background: #a855f7; }
  .detail-badge.ding { background: #2a9d8f; }
  .detail-title { font-size: 15px; font-weight: 700; }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px solid #2f3336;
    font-size: 12px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #71767b; }
  .detail-value { color: #e7e9ea; font-weight: 500; }
  .btn-close {
    width: 100%; padding: 8px; margin-top: 12px;
    background: #2f3336; color: #71767b; border: none;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .btn-close:hover { background: #3f4448; }

  .bottom-hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: #e7e9ea;
    padding: 8px 16px; border-radius: 20px;
    font-size: 12px; z-index: 100;
  }
  .bottom-hint span { color: #f4a261; }
</style>
</head>
<body>

<header>
  <div class="logo">🦐 象山片区物业可视化系统</div>
  <div class="mode-switch">
    <button class="mode-btn active" id="btnView" onclick="setMode('view')">📍 查看模式</button>
    <button class="mode-btn" id="btnPick" onclick="setMode('pick')">🎯 拾取模式</button>
  </div>
</header>

<div class="main" id="mainArea">
  <div id="inner">
    <img id="mapImg" src="https://xiangshanwuye-1301275283.cos.accelerate.myqcloud.com/%E6%9C%80%E6%96%B0%E5%9C%B0%E5%9B%BE(1).jpg" ondragstart="return false">
    <div id="dotLayer"></div>
    <div id="crosshair">
      <div class="cross-x"></div>
      <div class="cross-y"></div>
      <div class="cross-center"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-title" id="panelTitle">物业列表</div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" 
             placeholder="搜索名称/持方/承租人..." oninput="filterProperties()">
    </div>
    
    <div class="party-filter">
      <div class="filter-btn active" onclick="setPartyFilter('all')">全部</div>
      <div class="filter-btn jia" onclick="setPartyFilter('甲')">甲方</div>
      <div class="filter-btn yi" onclick="setPartyFilter('乙')">乙方</div>
      <div class="filter-btn bing" onclick="setPartyFilter('丙')">丙方</div>
      <div class="filter-btn ding" onclick="setPartyFilter('丁')">丁方</div>
    </div>

    <div id="pickPanel" style="display:none">
      <div class="pick-result">
        <div class="coord-row">
          <span class="label">相对坐标:</span>
          <span class="value" id="pickRxRy">--, --</span>
        </div>
        <div class="coord-row">
          <span class="label">像素坐标:</span>
          <span class="value" id="pickPxPy">--, --</span>
        </div>
        <button class="btn-copy" onclick="copyPickCoord()">📋 复制坐标</button>
      </div>
      <div style="font-size:11px;color:#71767b;margin-bottom:10px">
        点击地图任意位置获取坐标<br>
        滚轮缩放 | Shift+拖拽平移
      </div>
    </div>

    <div id="detailPanel" class="detail-panel" style="display:none">
      <div class="detail-header">
        <div class="detail-badge" id="detailBadge"></div>
        <div class="detail-title" id="detailTitle"></div>
      </div>
      <div class="detail-row">
        <span class="detail-label">编号</span>
        <span class="detail-value" id="detailId"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">持方</span>
        <span class="detail-value" id="detailParty"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">面积</span>
        <span class="detail-value" id="detailArea"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">承租人</span>
        <span class="detail-value" id="detailTenant"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">行业</span>
        <span class="detail-value" id="detailIndustry"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">状态</span>
        <span class="detail-value" id="detailStatus"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">联系电话</span>
        <span class="detail-value" id="detailContact"></span>
      </div>
      <button class="btn-close" onclick="closeDetail()">关闭</button>
    </div>

    <div class="prop-list" id="propList"></div>
  </div>

  <div class="bottom-hint" id="bottomHint">
    <span>滚轮</span>缩放 | <span>Shift+拖拽</span>平移 | 点击<span>标记</span>查看详情
  </div>
</div>

<script>
// 数据直接嵌入，避免跨域问题
const properties = [
  {"id":"01","party":"甲","name":"龙图光罩","area":"100㎡","tenant":"深圳市龙图光罩股份有限公司","industry":"科技","status":"在用","contact":"张三","phone":"13800138000","rx":0.5638,"ry":0.4103},
  {"id":"02","party":"甲","name":"轩敏电子","area":"800㎡","tenant":"轩敏电子(深圳)有限公司","industry":"电子","status":"在用","contact":"张三","phone":"13800138000","rx":0.5816,"ry":0.4440},
  {"id":"03","party":"甲","name":"巴哈尔壳体","area":"500㎡","tenant":"巴哈尔壳体(深圳)有限公司","industry":"电子","status":"在用","contact":"张三","phone":"13800138000","rx":0.5990,"ry":0.4787},
  {"id":"04","party":"丙","name":"创亿欣","area":"200㎡","tenant":"深圳市创亿欣精密电子股份有限公司","industry":"电子","status":"在用","contact":"明明","phone":"13111111111","rx":0.5563,"ry":0.4957},
  {"id":"05","party":"丙","name":"三力五金","area":"5000㎡","tenant":"三力五金机械制品(深圳)有限公司","industry":"五金","status":"在用","contact":"明明","phone":"13111111111","rx":0.5509,"ry":0.4854},
  {"id":"06","party":"丙","name":"祺利电子","area":"600㎡","tenant":"深圳市祺利电子有限公司","industry":"电子","status":"在用","contact":"明明","phone":"13111111111","rx":0.4658,"ry":0.4532},
  {"id":"07","party":"丙","name":"鸿荣恒","area":"500㎡","tenant":"鸿荣恒","industry":"电子","status":"在用","contact":"明明","phone":"13111111111","rx":0.4721,"ry":0.4660},
  {"id":"08","party":"丙","name":"百瑞琪","area":"200㎡","tenant":"深圳市百瑞琪医疗器械有限公司","industry":"医疗","status":"在用","contact":"明明","phone":"13111111111","rx":0.4459,"ry":0.5031},
  {"id":"09","party":"丁","name":"汉宫草本","area":"800㎡","tenant":"汉宫草本健康产业园","industry":"医疗","status":"在用","contact":"李一","phone":"13780013800","rx":0.3597,"ry":0.5094},
  {"id":"10","party":"丁","name":"百汇精密","area":"3000㎡","tenant":"百汇精密塑胶模具(深圳)有限公司","industry":"塑胶","status":"在用","contact":"李一","phone":"13780013800","rx":0.3034,"ry":0.5553},
  {"id":"11","party":"丁","name":"中天世纪","area":"2000㎡","tenant":"中天世纪实业(深圳)有限公司","industry":"科技","status":"在用","contact":"李一","phone":"13780013800","rx":0.3223,"ry":0.5650},
  {"id":"12","party":"乙","name":"创鑫激光","area":"10000㎡","tenant":"深圳市创鑫激光股份有限公司","industry":"科技","status":"在用","contact":"王五","phone":"13800138001","rx":0.2413,"ry":0.7282},
  {"id":"13","party":"乙","name":"赛尔康","area":"8000㎡","tenant":"赛尔康技术(深圳)有限公司","industry":"科技","status":"在用","contact":"王五","phone":"13800138001","rx":0.3348,"ry":0.7657},
  {"id":"14","party":"乙","name":"德昌电机","area":"20000㎡","tenant":"德昌电机","industry":"科技","status":"在用","contact":"王五","phone":"13800138001","rx":0.4489,"ry":0.3227},
  {"id":"15","party":"乙","name":"森骏模具","area":"5000㎡","tenant":"森骏模具","industry":"塑胶","status":"在用","contact":"王五","phone":"13800138001","rx":0.4792,"ry":0.2587}
];

const partyMap = { '甲':'jia', '乙':'yi', '丙':'bing', '丁':'ding' };
properties.forEach(p => p.partyKey = partyMap[p.party]);

const mapImg = document.getElementById('mapImg');
const inner = document.getElementById('inner');
const dotLayer = document.getElementById('dotLayer');
const mainArea = document.getElementById('mainArea');
const crosshair = document.getElementById('crosshair');

let imgW = 0, imgH = 0;
let scale = 1, panX = 0, panY = 0;
let isDragging = false;
let currentMode = 'view';
let lastPick = { rx:0, ry:0 };
let currentPartyFilter = 'all';
let currentSearchText = '';

mapImg.onload = () => {
  imgW = mapImg.naturalWidth;
  imgH = mapImg.naturalHeight;
  renderMarkers();
  renderPropList();
  fitToStage();
};

function applyTransform() {
  inner.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function fitToStage() {
  const sw = mainArea.clientWidth, sh = mainArea.clientHeight;
  if (!imgW) return;
  scale = Math.min(sw / imgW, sh / imgH) * 0.85;
  panX = (sw - imgW * scale) / 2;
  panY = (sh - imgH * scale) / 2;
  applyTransform();
}

function renderMarkers() {
  dotLayer.innerHTML = '';
  properties.forEach(p => {
    const matchParty = currentPartyFilter === 'all' || p.party === currentPartyFilter;
    const searchText = currentSearchText || '';
    const matchSearch = !searchText || 
      p.name.toLowerCase().includes(searchText) ||
      p.party.toLowerCase().includes(searchText) ||
      (p.tenant && p.tenant.toLowerCase().includes(searchText)) ||
      (p.industry && p.industry.toLowerCase().includes(searchText));
    
    if (!matchParty || !matchSearch) return;
    
    const el = document.createElement('div');
    el.className = `dm ${p.partyKey}`;
    el.innerHTML = `<div class="dm-body">${p.id}</div><div class="dm-num">${p.id}</div>`;
    el.style.left = (p.rx * imgW) + 'px';
    el.style.top = ((1 - p.ry) * imgH) + 'px';
    el.onclick = () => highlightProp(p.id);
    dotLayer.appendChild(el);
  });
}

function renderPropList() {
  const list = document.getElementById('propList');
  
  const filtered = properties.filter(p => {
    const matchParty = currentPartyFilter === 'all' || p.party === currentPartyFilter;
    const searchText = currentSearchText || '';
    const matchSearch = !searchText || 
      p.name.toLowerCase().includes(searchText) ||
      p.party.toLowerCase().includes(searchText) ||
      (p.tenant && p.tenant.toLowerCase().includes(searchText)) ||
      (p.industry && p.industry.toLowerCase().includes(searchText));
    return matchParty && matchSearch;
  });
  
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#71767b;padding:20px;font-size:12px">没有找到匹配的物业</div>';
    return;
  }
  
  list.innerHTML = filtered.map(p => `
    <div class="prop-item" data-id="${p.id}" onclick="highlightProp('${p.id}')">
      <div class="prop-dot" style="background:${getPartyColor(p.party)}"></div>
      <div class="prop-info">
        <div class="prop-id">${p.id} · ${p.party}方</div>
        <div class="prop-name">${p.name}</div>
        <div class="prop-coord">${p.rx.toFixed(4)}, ${p.ry.toFixed(4)}</div>
      </div>
    </div>
  `).join('');
}

function getPartyColor(p) {
  return { '甲':'#e63946', '乙':'#f4a261', '丙':'#a855f7', '丁':'#2a9d8f' }[p];
}

function highlightProp(id) {
  const p = properties.find(x => x.id === id);
  if (!p) return;
  
  document.querySelectorAll('.prop-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('propList').style.display = 'none';
  
  document.getElementById('detailBadge').textContent = p.id;
  document.getElementById('detailBadge').className = 'detail-badge ' + p.partyKey;
  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailId').textContent = p.id + '号';
  document.getElementById('detailParty').textContent = p.party + '方';
  document.getElementById('detailArea').textContent = p.area || '-';
  document.getElementById('detailTenant').textContent = p.tenant || '-';
  document.getElementById('detailIndustry').textContent = p.industry || '-';
  document.getElementById('detailStatus').textContent = p.status || '-';
  document.getElementById('detailContact').textContent = p.contact || '-';
}

function closeDetail() {
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('propList').style.display = 'block';
  document.querySelectorAll('.prop-item').forEach(el => el.classList.remove('active'));
}

function filterProperties() {
  currentSearchText = document.getElementById('searchInput').value.toLowerCase().trim();
  renderPropList();
  renderMarkers();
}

function setPartyFilter(party) {
  currentPartyFilter = party;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    if (party === 'all' && btn.textContent === '全部') btn.classList.add('active');
    if (party === '甲' && btn.classList.contains('jia')) btn.classList.add('active');
    if (party === '乙' && btn.classList.contains('yi')) btn.classList.add('active');
    if (party === '丙' && btn.classList.contains('bing')) btn.classList.add('active');
    if (party === '丁' && btn.classList.contains('ding')) btn.classList.add('active');
  });
  renderPropList();
  renderMarkers();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnView').classList.toggle('active', mode === 'view');
  document.getElementById('btnPick').classList.toggle('active', mode === 'pick');
  document.getElementById('pickPanel').style.display = mode === 'pick' ? 'block' : 'none';
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('propList').style.display = mode === 'view' ? 'block' : 'none';
  document.getElementById('panelTitle').textContent = mode === 'pick' ? '坐标拾取' : '物业列表';
  document.getElementById('bottomHint').innerHTML = mode === 'pick'
    ? '<span>单击</span>地图获取坐标 | <span>滚轮</span>缩放 | <span>Shift+拖拽</span>平移'
    : '<span>滚轮</span>缩放 | <span>Shift+拖拽</span>平移 | 点击<span>标记</span>查看详情';
  crosshair.classList.toggle('show', mode === 'pick');
}

function screenToRel(sx, sy) {
  const px = (sx - panX) / scale;
  const py = (sy - panY) / scale;
  return {
    rx: px / imgW,
    ry: 1 - (py / imgH)
  };
}

let dragStart = { x: 0, y: 0, panX: 0, panY: 0 };

mainArea.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  
  if (e.shiftKey) {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY, panX, panY };
    mainArea.style.cursor = 'grabbing';
  } else if (currentMode === 'pick') {
    const rect = mainArea.getBoundingClientRect();
    const c = screenToRel(e.clientX - rect.left, e.clientY - rect.top);
    lastPick = { rx: c.rx, ry: c.ry };

    const pickRxRy = document.getElementById('pickRxRy');
    const pickPxPy = document.getElementById('pickPxPy');
    pickRxRy.textContent = `${c.rx.toFixed(4)}, ${c.ry.toFixed(4)}`;
    pickRxRy.dataset.rx = c.rx.toFixed(4);
    pickRxRy.dataset.ry = c.ry.toFixed(4);
    pickPxPy.textContent = `${Math.round(c.rx * imgW)}, ${Math.round((1-c.ry) * imgH)}`;

    crosshair.style.left = (c.rx * imgW) + 'px';
    crosshair.style.top = ((1 - c.ry) * imgH) + 'px';
  }
});

mainArea.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = dragStart.panX + (e.clientX - dragStart.x);
  panY = dragStart.panY + (e.clientY - dragStart.y);
  applyTransform();
});

mainArea.addEventListener('mouseup', () => {
  isDragging = false;
  mainArea.style.cursor = 'default';
});

mainArea.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mainArea.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const ix = (sx - panX) / scale, iy = (sy - panY) / scale;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  scale = Math.max(0.2, Math.min(5, scale * factor));
  panX = sx - ix * scale;
  panY = sy - iy * scale;
  applyTransform();
}, { passive: false });

function copyPickCoord() {
  const pickRxRy = document.getElementById('pickRxRy');
  const rx = pickRxRy.dataset.rx || lastPick.rx.toFixed(4);
  const ry = pickRxRy.dataset.ry || lastPick.ry.toFixed(4);
  const text = `${rx}, ${ry}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ 已复制: ' + text;
    setTimeout(() => btn.textContent = '📋 复制坐标', 2000);
  });
}

window.addEventListener('resize', fitToStage);
</script>
</body>
</html>
